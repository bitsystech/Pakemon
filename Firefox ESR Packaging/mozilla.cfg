// Set OS dependent file paths for Mac OSX and Windows
lockPref("autoadmin.global_config_url", getConfigPath());
function getConfigPath() {
const Cc = Components.classes;
const Ci = Components.interfaces;

lockPref("autoadmin.append_emailaddr",false);

var xulRuntime = Cc["@mozilla.org/xre/app-info;1"].getService(Ci.nsIXULRuntime);
pref("hm.result.os", xulRuntime.OS)

if (xulRuntime.OS == "Darwin") {
	return "file:///usr/local/etc/mozilla.cfg";
	}
if (xulRuntime.OS == "WINNT") {
	return "file:///c:/Program%20Files%20(x86)/HM%20Firefox%20Config/mozilla.cfg";
	}
}